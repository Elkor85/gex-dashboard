<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEX Dashboard — Options Flow Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e14; --card: #131722; --border: #232936;
    --text: #e2e8f0; --muted: #8892a6;
    --green: #22c55e; --red: #ef4444; --accent: #3b82f6; --gold: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  #updated { color: var(--muted); font-size: 12px; margin-left: auto; }
  #tickers { display: flex; gap: 6px; flex-wrap: wrap; }
  .tk-btn { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s; }
  .tk-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .stat .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); } .neg { color: var(--red); } .gold { color: var(--gold); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media(max-width: 900px){ .grid{grid-template-columns:1fr;} }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .chart-wrap { position: relative; height: 320px; }
  .wide { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  tr:hover td { background: rgba(255,255,255,.02); }
  #err { color: var(--red); padding: 12px 24px; display: none; }
</style>
</head>
<body>
<header>
  <h1>GEX<span>·</span>Dashboard</h1>
  <div id="tickers"></div>
  <div id="updated"></div>
</header>
<div id="err"></div>
<main>
  <div class="stats">
    <div class="stat"><div class="label">Spot</div><div class="value" id="s-spot">—</div></div>
    <div class="stat"><div class="label">Total GEX</div><div class="value" id="s-gex">—</div></div>
    <div class="stat"><div class="label">Zero Gamma</div><div class="value gold" id="s-zg">—</div></div>
    <div class="stat"><div class="label">Call Wall</div><div class="value pos" id="s-cw">—</div></div>
    <div class="stat"><div class="label">Put Wall</div><div class="value neg" id="s-pw">—</div></div>
    <div class="stat"><div class="label">Daily Theta</div><div class="value" id="s-theta">—</div></div>
  </div>
  <div class="grid">
    <div class="panel wide"><h2>GEX by Strike ($ per 1% move)</h2><div class="chart-wrap"><canvas id="gexChart"></canvas></div></div>
    <div class="panel"><h2>Delta Exposure by Strike</h2><div class="chart-wrap"><canvas id="dexChart"></canvas></div></div>
    <div class="panel"><h2>Vanna Exposure by Strike</h2><div class="chart-wrap"><canvas id="vexChart"></canvas></div></div>
    <div class="panel"><h2>Theta Exposure by Strike</h2><div class="chart-wrap"><canvas id="thetaChart"></canvas></div></div>
    <div class="panel"><h2>IV & Volume by Strike</h2><div class="chart-wrap"><canvas id="ivChart"></canvas></div></div>
    <div class="panel wide"><h2>Net GEX by Expiration</h2><div class="chart-wrap" style="height:220px;"><canvas id="expChart"></canvas></div></div>
    <div class="panel wide"><h2>Strike Table (Top OI)</h2>
      <div style="overflow-x:auto;"><table id="tbl"><thead><tr>
        <th>Strike</th><th>GEX</th><th>DEX</th><th>VEX</th><th>Theta</th><th>IV</th><th>Volume</th><th>OI</th>
      </tr></thead><tbody></tbody></table></div>
    </div>
  </div>
</main>
<script>
let DATA=null, CUR=null;
const charts={};
function fmt(v){const a=Math.abs(v);if(a>=1e12)return (v/1e12).toFixed(2)+'T';if(a>=1e9)return (v/1e9).toFixed(2)+'B';if(a>=1e6)return (v/1e6).toFixed(2)+'M';if(a>=1e3)return (v/1e3).toFixed(1)+'K';return v.toFixed(2);}
function mk(id,cfg){if(charts[id])charts[id].destroy();charts[id]=new Chart(document.getElementById(id),cfg);}
async function load(){try{const r=await fetch('data/gex_data.json?t='+Date.now());DATA=await r.json();document.getElementById('err').style.display='none';
document.getElementById('updated').textContent='Updated '+new Date(DATA.updated_utc).toLocaleString();
buildTabs();if(!CUR)selectTab(Object.keys(DATA.tickers)[0]);}catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='Failed to load data: '+e;}}
function buildTabs(){const c=document.getElementById('tickers');c.innerHTML='';Object.keys(DATA.tickers).forEach(t=>{const b=document.createElement('button');b.className='tk-btn'+(t===CUR?' active':'');b.textContent=t;b.onclick=()=>selectTab(t);c.appendChild(b);});}
function selectTab(t){CUR=t;buildTabs();render();}
function render(){
 const d=DATA.tickers[CUR];if(!d||d.error){return;}
 document.getElementById('s-spot').textContent=d.spot??'—';
 const g=document.getElementById('s-gex');g.textContent=fmt(d.total_gex||0);g.className='value '+(d.total_gex>=0?'pos':'neg');
 document.getElementById('s-zg').textContent=d.zero_gamma??'n/a';
 document.getElementById('s-cw').textContent=d.call_wall??'n/a';
 document.getElementById('s-pw').textContent=d.put_wall??'n/a';
 document.getElementById('s-theta').textContent=fmt(d.daily_theta||0);
 const strikes=Object.keys(d.gex_by_strike).map(Number).sort((a,b)=>a-b);
 const labels=strikes.map(String);
 const gexArr=strikes.map(k=>d.gex_by_strike[String(k)]||0);
 const spotLine={type:'line',label:'Spot',data:labels.map(()=>d.spot),borderColor:'#f59e0b',borderDash:[6,4],pointRadius:0,borderWidth:1.5,order:0};
 let zgLine=null;if(d.zero_gamma&&labels.map(Number).some(s=>Math.abs(s-d.zero_gamma)<strikes[1]-strikes[0]))zgLine={type:'line',label:'ZeroGamma',data:labels.map(()=>d.zero_gamma),borderColor:'#a78bfa',pointRadius:0,borderWidth:1.5};
 const base={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
   scales:{x:{ticks:{color:'#8892a6',maxRotation:90,font:{size:10}},grid:{color:'#1a2030'}},
           y:{ticks:{color:'#8892a6',callback:v=>fmt(v)},grid:{color:'#1a2030'}}},
   plugins:{legend:{labels:{color:'#e2e8f0',font:{size:11}}}}};
 mk('gexChart',{data:{labels,datasets:[{type:'bar',label:'Call GEX',data:gexArr.map(v=>v>0?v:0),backgroundColor:'rgba(34,197,94,.65)'},{type:'bar',label:'Put GEX',data:gexArr.map(v=>v<0?v:0),backgroundColor:'rgba(239,68,68,.65)'},spotLine,zgLine].filter(Boolean)},options:JSON.parse(JSON.stringify(base))});
 function lineChart(id,key,color){mk(id,{data:{labels,datasets:[{type:'line',label:key,data:strikes.map(k=>d[key][String(k)]||0),borderColor:color,backgroundColor:color+'33',fill:true,tension:.3,pointRadius:0,borderWidth:2},spotLine]},options:JSON.parse(JSON.stringify(base))});}
 lineChart('dexChart','dex_by_strike','#3b82f6');
 lineChart('vexChart','vex_by_strike','#f472b6');
 lineChart('thetaChart','theta_by_strike','#fb923c');
 mk('ivChart',{data:{labels,datasets:[{type:'line',label:'IV %',yAxisID:'y1',data:strikes.map(k=>(d.iv_by_strike[String(k)]||0)*100),borderColor:'#a78bfa',tension:.3,pointRadius:0,borderWidth:2},{type:'bar',yAxisID:'y',label:'Volume',data:strikes.map(k=>d.volume_by_strike[String(k)]||0),backgroundColor:'rgba(56,189,248,.5)'}]},
   options:(()=>{const o=JSON.parse(JSON.stringify(base));o.scales.y1={position:'right',ticks:{color:'#a78bfa'},grid:{drawOnChartArea:false}};return o;})()});
 const exps=Object.keys(d.net_gex_by_expiry);
 mk('expChart',{data:{labels:exps,datasets:[{type:'bar',label:'Net GEX',data:exps.map(e=>d.net_gex_by_expiry[e]),backgroundColor:exps.map(e=>d.net_gex_by_expiry[e]>=0?'rgba(34,197,94,.65)':'rgba(239,68,68,.65)')}]},options:JSON.parse(JSON.stringify(base))});
 const rows=strikes.map(k=>({k,g:d.gex_by_strike[String(k)]||0,dx:d.dex_by_strike[String(k)]||0,vx:d.vex_by_strike[String(k)]||0,th:d.theta_by_strike[String(k)]||0,iv:(d.iv_by_strike[String(k)]||0)*100,v:d.volume_by_strike[String(k)]||0,oi:d.oi_by_strike[String(k)]||0}));
 rows.sort((a,b)=>b.oi-a.oi);
 document.querySelector('#tbl tbody').innerHTML=rows.slice(0,25).map(r=>`<tr><td>${r.k}</td><td class="${r.g>=0?'pos':'neg'}">${fmt(r.g)}</td><td>${fmt(r.dx)}</td><td>${fmt(r.vx)}</td><td>${fmt(r.th)}</td><td>${r.iv.toFixed(1)}%</td><td>${fmt(r.v)}</td><td>${fmt(r.oi)}</td></tr>`).join('');
}
load();setInterval(load,120000);
</script>
</body>
</html>
